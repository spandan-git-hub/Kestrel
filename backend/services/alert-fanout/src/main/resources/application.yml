server:
  port: 8084

spring:
  application:
    name: alert-fanout

aws:
  region: ${AWS_REGION:${AWS_DEFAULT_REGION:ap-south-1}}
  dynamodb:
    endpoint: ${AWS_ENDPOINT_URL:${AWS_DYNAMODB_ENDPOINT:}}

kestrel:
  stage: ${STAGE:prod}
  persistence:
    type: ${KESTREL_PERSISTENCE:dynamodb}
  telegram:
    bot-token: "${TELEGRAM_BOT_TOKEN:}"
    chat-id: ""
