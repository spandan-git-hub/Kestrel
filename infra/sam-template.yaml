AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Kestrel Production Serverless Blueprint
  AWS Lambda (Java 21 LTS + SnapStart), Amazon DynamoDB (with TTL), Amazon SQS/SNS Event Topology,
  Amazon EventBridge Scheduler, and Amazon CloudFront Edge Routing.

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment stage environment name.
  OpenMeteoBaseUrl:
    Type: String
    Default: https://flood-api.open-meteo.com/v1/flood
    Description: Base URL for the Open-Meteo Flood API.
  TelegramBotToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: Telegram Bot API Token for real alert delivery.
  VapidPublicKey:
    Type: String
    Default: ""
    Description: W3C Web Push VAPID Public Key.
  VapidPrivateKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: W3C Web Push VAPID Private Key.
  VapidSubject:
    Type: String
    Default: "mailto:alerts@kestrel.in"
    Description: Subject claim for Web Push VAPID authentication.

Globals:
  Function:
    Runtime: java21
    Architectures:
      - x86_64
    Timeout: 60
    MemorySize: 512
    Environment:
      Variables:
        STAGE: !Ref Stage
        AWS_REGION_NAME: !Ref AWS::Region
        OPEN_METEO_BASE_URL: !Ref OpenMeteoBaseUrl
        TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
        VAPID_PUBLIC_KEY: !Ref VapidPublicKey
        VAPID_PRIVATE_KEY: !Ref VapidPrivateKey
        VAPID_SUBJECT: !Ref VapidSubject
        DYNAMODB_REGISTRY_LOCATION: !Ref RegistryLocationTable
        DYNAMODB_REGISTRY_SUBSCRIPTION: !Ref RegistrySubscriptionTable
        DYNAMODB_FLOOD_SNAPSHOT: !Ref FloodSnapshotTable
        DYNAMODB_FLOOD_POINT: !Ref FloodMonitoredPointTable
        DYNAMODB_HEAT_NORMAL: !Ref HeatNormalTable
        DYNAMODB_HEAT_MONITORED_POINT: !Ref HeatMonitoredPointTable
        DYNAMODB_HEAT_FORECAST_RUN: !Ref HeatForecastRunTable
        DYNAMODB_HEAT_FORECAST_DAY: !Ref HeatForecastDayTable
        DYNAMODB_HEAT_FEED_STATE: !Ref HeatFeedStateTable
        DYNAMODB_AQ_MONITORED_POINT: !Ref AqMonitoredPointTable
        DYNAMODB_AQ_FORECAST_RUN: !Ref AqForecastRunTable
        DYNAMODB_AQ_HOURLY_VALUE: !Ref AqHourlyValueTable
        DYNAMODB_AQ_FEED_STATE: !Ref AqFeedStateTable
        DYNAMODB_RULES_ALERT_STATE: !Ref RulesAlertStateTable
        DYNAMODB_FANOUT_REPLICA: !Ref FanoutSubscriberReplicaTable
        DYNAMODB_FANOUT_DELIVERY: !Ref FanoutDeliveryTable
        DYNAMODB_FANOUT_TG_BUCKET: !Ref FanoutTgBucketTable
        DYNAMODB_REPORTS: !Ref ReportsTable
        SNS_REGISTRY_TOPIC_ARN: !Ref RegistryTopic
        SNS_SIGNALS_TOPIC_ARN: !Ref SignalsTopic
        SNS_ALERTS_TOPIC_ARN: !Ref AlertsTopic
        SNS_RECEIPTS_TOPIC_ARN: !Ref ReceiptsTopic
        SQS_RULES_FLOOD_URL: !Ref RulesFloodQueue
        SQS_RULES_HEAT_URL: !Ref RulesHeatQueue
        SQS_RULES_AQ_URL: !Ref RulesAqQueue
        SQS_FANOUT_ALERTS_URL: !Ref FanoutAlertsQueue
        SQS_FANOUT_REGISTRY_URL: !Ref FanoutRegistryQueue
        SQS_DELIVERY_TELEGRAM_URL: !Ref DeliveryTelegramQueue
        SQS_DELIVERY_WEBPUSH_URL: !Ref DeliveryWebPushQueue

Resources:
  # ============================================================================
  # 1. DYNAMODB TABLES (Database-per-Service with TTL & Strict Isolation)
  # ============================================================================

  RegistryLocationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'kestrel_registry_location_${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: locationId
          AttributeType: S
      KeySchema:
        - AttributeName: locationId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Service
          Value: subscriber-registry
        - Key: Project
          Value: Kestrel

  RegistryConsentLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'kestrel_registry_consent_log_${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: consentId
          AttributeType: S
        - AttributeName: token
          AttributeType: S
      KeySchema:
        - AttributeName: consentId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: token-index
          KeySchema:
            - AttributeName: token
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Service
          Value: subscriber-registry
        - Key: Project
          Value: Kestrel

  RegistrySubscriptionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'kestrel_registry_subscription_${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: token
          AttributeType: S
        - AttributeName: locationId
          AttributeType: S
      KeySchema:
        - AttributeName: token
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: locationId-index
          KeySchema:
            - AttributeName: locationId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Service
          Value: subscriber-registry
        - Key: Project
          Value: Kestrel

  FloodSnapshotTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'kestrel_flood_snapshot_${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: locationId
          AttributeType: S
        - AttributeName: snapshotTimestamp
          AttributeType: S
      KeySchema:
        - AttributeName: locationId
          KeyType: HASH
        - AttributeName: snapshotTimestamp
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Service
          Value: flood-ingest
        - Key: Project
          Value: Kestrel

  FloodMonitoredPointTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'kestrel_flood_monitored_point_${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: locationId
          AttributeType: S
      KeySchema:
        - AttributeName: locationId
          KeyType: HASH
      Tags:
        - Key: Service
          Value: flood-ingest
        - Key: Project
          Value: Kestrel

  FloodThresholdTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'kestrel_flood_threshold_${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: locationId
          AttributeType: S
      KeySchema:
        - AttributeName: locationId
          KeyType: HASH
      Tags:
        - Key: Service
          Value: flood-ingest
        - Key: Project
          Value: Kestrel

  HeatNormalTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'kestrel_heat_normal_${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: locationId
          AttributeType: S
        - AttributeName: dayOfYear
          AttributeType: N
      KeySchema:
        - AttributeName: locationId
          KeyType: HASH
        - AttributeName: dayOfYear
          KeyType: RANGE
      Tags:
        - Key: Service
          Value: heat-ingest
        - Key: Project
          Value: Kestrel

  HeatMonitoredPointTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'kestrel_heat_monitored_point_${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: locationId
          AttributeType: S
      KeySchema:
        - AttributeName: locationId
          KeyType: HASH
      Tags:
        - Key: Service
          Value: heat-ingest
        - Key: Project
          Value: Kestrel

  HeatForecastRunTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'kestrel_heat_forecast_run_${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: locationId
          AttributeType: S
        - AttributeName: runId
          AttributeType: S
      KeySchema:
        - AttributeName: locationId
          KeyType: HASH
        - AttributeName: runId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Service
          Value: heat-ingest
        - Key: Project
          Value: Kestrel

  HeatForecastDayTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'kestrel_heat_forecast_day_${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: locationId
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: locationId
          KeyType: HASH
        - AttributeName: date
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Service
          Value: heat-ingest
        - Key: Project
          Value: Kestrel

  HeatFeedStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'kestrel_heat_feed_state_${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: feedName
          AttributeType: S
      KeySchema:
        - AttributeName: feedName
          KeyType: HASH
      Tags:
        - Key: Service
          Value: heat-ingest
        - Key: Project
          Value: Kestrel

  AqMonitoredPointTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'kestrel_aq_monitored_point_${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: locationId
          AttributeType: S
      KeySchema:
        - AttributeName: locationId
          KeyType: HASH
      Tags:
        - Key: Service
          Value: aq-ingest
        - Key: Project
          Value: Kestrel

  AqForecastRunTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'kestrel_aq_forecast_run_${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: locationId
          AttributeType: S
        - AttributeName: runId
          AttributeType: S
      KeySchema:
        - AttributeName: locationId
          KeyType: HASH
        - AttributeName: runId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Service
          Value: aq-ingest
        - Key: Project
          Value: Kestrel

  AqHourlyValueTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'kestrel_aq_hourly_value_${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: locationId
          AttributeType: S
        - AttributeName: time
          AttributeType: S
      KeySchema:
        - AttributeName: locationId
          KeyType: HASH
        - AttributeName: time
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Service
          Value: aq-ingest
        - Key: Project
          Value: Kestrel

  AqFeedStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'kestrel_aq_feed_state_${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: feedName
          AttributeType: S
      KeySchema:
        - AttributeName: feedName
          KeyType: HASH
      Tags:
        - Key: Service
          Value: aq-ingest
        - Key: Project
          Value: Kestrel

  RulesAlertStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'kestrel_rules_alert_state_${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: locationId
          AttributeType: S
      KeySchema:
        - AttributeName: locationId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Service
          Value: rules-engine
        - Key: Project
          Value: Kestrel

  FanoutSubscriberReplicaTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'kestrel_fanout_subscriber_replica_${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: locationId
          AttributeType: S
        - AttributeName: token
          AttributeType: S
        - AttributeName: channel
          AttributeType: S
      KeySchema:
        - AttributeName: locationId
          KeyType: HASH
        - AttributeName: token
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: channel-index
          KeySchema:
            - AttributeName: channel
              KeyType: HASH
            - AttributeName: token
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Service
          Value: alert-fanout
        - Key: Project
          Value: Kestrel

  FanoutDeliveryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'kestrel_fanout_delivery_${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: deliveryId
          AttributeType: S
        - AttributeName: alertId
          AttributeType: S
        - AttributeName: dispatchedAt
          AttributeType: S
      KeySchema:
        - AttributeName: deliveryId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: alertId-index
          KeySchema:
            - AttributeName: alertId
              KeyType: HASH
            - AttributeName: dispatchedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Service
          Value: alert-fanout
        - Key: Project
          Value: Kestrel

  FanoutTgBucketTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'kestrel_fanout_tg_bucket_${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Service
          Value: alert-fanout
        - Key: Project
          Value: Kestrel

  ReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'kestrel_reports_${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: reportId
          AttributeType: S
        - AttributeName: locationId
          AttributeType: S
        - AttributeName: reportedAt
          AttributeType: S
      KeySchema:
        - AttributeName: reportId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: locationId-index
          KeySchema:
            - AttributeName: locationId
              KeyType: HASH
            - AttributeName: reportedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Service
          Value: report-intake
        - Key: Project
          Value: Kestrel

  # ============================================================================
  # 2. AMAZON SNS TOPICS (Inter-Service Asynchronous Fanout)
  # ============================================================================

  RegistryTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'kestrel-registry-${Stage}'
      Tags:
        - Key: Project
          Value: Kestrel

  SignalsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'kestrel-signals-${Stage}'
      Tags:
        - Key: Project
          Value: Kestrel

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'kestrel-alerts-${Stage}'
      Tags:
        - Key: Project
          Value: Kestrel

  ReceiptsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'kestrel-receipts-${Stage}'
      Tags:
        - Key: Project
          Value: Kestrel

  # ============================================================================
  # 3. AMAZON SQS QUEUES & DLQs (Reliable Consumer Ingestion)
  # ============================================================================

  # --- Rules Flood Queue & DLQ ---
  RulesFloodDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'kestrel-rules-flood-dlq-${Stage}'
      MessageRetentionPeriod: 1209600 # 14 days

  RulesFloodQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'kestrel-rules-flood-${Stage}'
      VisibilityTimeout: 120
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RulesFloodDLQ.Arn
        maxReceiveCount: 3

  RulesFloodQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref RulesFloodQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt RulesFloodQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref SignalsTopic

  RulesFloodSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref SignalsTopic
      Protocol: sqs
      Endpoint: !GetAtt RulesFloodQueue.Arn
      RawMessageDelivery: true
      FilterPolicy:
        eventType:
          - FloodSignal

  # --- Rules Heat Queue & DLQ (Bulkhead Fault Isolation) ---
  RulesHeatDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'kestrel-rules-heat-dlq-${Stage}'
      MessageRetentionPeriod: 1209600 # 14 days

  RulesHeatQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'kestrel-rules-heat-${Stage}'
      VisibilityTimeout: 120
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RulesHeatDLQ.Arn
        maxReceiveCount: 3

  RulesHeatQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref RulesHeatQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt RulesHeatQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref SignalsTopic

  RulesHeatSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref SignalsTopic
      Protocol: sqs
      Endpoint: !GetAtt RulesHeatQueue.Arn
      RawMessageDelivery: true
      FilterPolicy:
        eventType:
          - HeatSignal

  # --- Rules AQ Queue & DLQ (Bulkhead Fault Isolation) ---
  RulesAqDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'kestrel-rules-aq-dlq-${Stage}'
      MessageRetentionPeriod: 1209600 # 14 days

  RulesAqQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'kestrel-rules-aq-${Stage}'
      VisibilityTimeout: 120
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RulesAqDLQ.Arn
        maxReceiveCount: 3

  RulesAqQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref RulesAqQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt RulesAqQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref SignalsTopic

  RulesAqSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref SignalsTopic
      Protocol: sqs
      Endpoint: !GetAtt RulesAqQueue.Arn
      RawMessageDelivery: true
      FilterPolicy:
        eventType:
          - AqSignal

  # --- Fanout Alerts Queue & DLQ ---
  FanoutAlertsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'kestrel-fanout-alerts-dlq-${Stage}'
      MessageRetentionPeriod: 1209600

  FanoutAlertsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'kestrel-fanout-alerts-${Stage}'
      VisibilityTimeout: 120
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt FanoutAlertsDLQ.Arn
        maxReceiveCount: 3

  FanoutAlertsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref FanoutAlertsQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt FanoutAlertsQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref AlertsTopic

  FanoutAlertsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: sqs
      Endpoint: !GetAtt FanoutAlertsQueue.Arn
      RawMessageDelivery: true
      FilterPolicy:
        eventType:
          - AlertEvent

  # --- Fanout Registry Queue & DLQ ---
  FanoutRegistryDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'kestrel-fanout-registry-dlq-${Stage}'
      MessageRetentionPeriod: 1209600

  FanoutRegistryQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'kestrel-fanout-registry-${Stage}'
      VisibilityTimeout: 120
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt FanoutRegistryDLQ.Arn
        maxReceiveCount: 3

  FanoutRegistryQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref FanoutRegistryQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt FanoutRegistryQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref RegistryTopic

  FanoutRegistrySubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref RegistryTopic
      Protocol: sqs
      Endpoint: !GetAtt FanoutRegistryQueue.Arn
      RawMessageDelivery: true
      FilterPolicy:
        eventType:
          - LocationUpserted
          - SubscriptionChanged

  # --- Delivery Telegram Queue & DLQ ---
  DeliveryTelegramDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'kestrel-delivery-telegram-dlq-${Stage}'
      MessageRetentionPeriod: 1209600

  DeliveryTelegramQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'kestrel-delivery-telegram-${Stage}'
      VisibilityTimeout: 120
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeliveryTelegramDLQ.Arn
        maxReceiveCount: 3

  # --- Delivery WebPush Queue & DLQ ---
  DeliveryWebPushDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'kestrel-delivery-webpush-dlq-${Stage}'
      MessageRetentionPeriod: 1209600

  DeliveryWebPushQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'kestrel-delivery-webpush-${Stage}'
      VisibilityTimeout: 120
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeliveryWebPushDLQ.Arn
        maxReceiveCount: 3

  # ============================================================================
  # 4. AWS LAMBDA FUNCTIONS (Java 21 LTS + SnapStart for User Endpoints)
  # ============================================================================

  # --- 4.1 Subscriber Registry Service ---
  SubscriberRegistryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'kestrel-subscriber-registry-${Stage}'
      CodeUri: ../backend/services/subscriber-registry/target/subscriber-registry-0.0.1-SNAPSHOT.jar
      Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RegistryLocationTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RegistrySubscriptionTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RegistryConsentLogTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt RegistryTopic.TopicName
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - '*'

  # --- 4.2 Flood Ingest Service ---
  FloodIngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'kestrel-flood-ingest-${Stage}'
      CodeUri: ../backend/services/flood-ingest/target/flood-ingest-0.0.1-SNAPSHOT.jar
      Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
      Timeout: 180
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FloodMonitoredPointTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FloodThresholdTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FloodSnapshotTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt SignalsTopic.TopicName
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - '*'
      Events:
        DailyFloodSchedule:
          Type: Schedule
          Properties:
            Schedule: cron(30 6 * * ? *)
            Name: !Sub 'kestrel-daily-flood-cron-${Stage}'
            Description: Automated daily Open-Meteo ensemble river forecast sync for all 45 Indian stations
            Enabled: true

  # --- 4.2b Heat Ingest Service ---
  HeatIngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'kestrel-heat-ingest-${Stage}'
      CodeUri: ../backend/services/heat-ingest/target/heat-ingest-0.0.1-SNAPSHOT.jar
      Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
      Timeout: 180
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HeatNormalTable
        - DynamoDBCrudPolicy:
            TableName: !Ref HeatMonitoredPointTable
        - DynamoDBCrudPolicy:
            TableName: !Ref HeatForecastRunTable
        - DynamoDBCrudPolicy:
            TableName: !Ref HeatForecastDayTable
        - DynamoDBCrudPolicy:
            TableName: !Ref HeatFeedStateTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt SignalsTopic.TopicName
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - '*'
      Events:
        TwiceDailyHeatSchedule:
          Type: Schedule
          Properties:
            Schedule: cron(15 4,16 * * ? *)
            Name: !Sub 'kestrel-twice-daily-heat-cron-${Stage}'
            Description: Automated twice-daily Open-Meteo weather forecast sync for heat advisories (04:15 & 16:15 UTC)
            Enabled: true

  # --- 4.2c Air Quality Ingest Service ---
  AqIngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'kestrel-aq-ingest-${Stage}'
      CodeUri: ../backend/services/aq-ingest/target/aq-ingest-0.0.1-SNAPSHOT.jar
      Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
      Timeout: 180
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AqMonitoredPointTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AqForecastRunTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AqHourlyValueTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AqFeedStateTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt SignalsTopic.TopicName
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - '*'
      Events:
        TwiceDailyAqSchedule:
          Type: Schedule
          Properties:
            Schedule: cron(20 2,14 * * ? *)
            Name: !Sub 'kestrel-twice-daily-aq-cron-${Stage}'
            Description: Automated twice-daily Open-Meteo Air Quality forecast sync (02:20 & 14:20 UTC)
            Enabled: true

  # --- 4.3 Rules Engine Flood Service (Bulkhead Isolation) ---
  RulesEngineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'kestrel-rules-engine-${Stage}'
      CodeUri: ../backend/services/rules-engine/target/rules-engine-0.0.1-SNAPSHOT.jar
      Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
      MemorySize: 256
      Timeout: 60
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: rulesFloodQueueFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RulesAlertStateTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertsTopic.TopicName
        - SQSPollerPolicy:
            QueueName: !GetAtt RulesFloodQueue.QueueName
      Events:
        RulesFloodQueueTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt RulesFloodQueue.Arn
            BatchSize: 10
            Enabled: true

  # --- 4.3b Rules Engine Heat Service (Bulkhead Fault Isolation) ---
  RulesEngineHeatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'kestrel-rules-engine-heat-${Stage}'
      CodeUri: ../backend/services/rules-engine/target/rules-engine-0.0.1-SNAPSHOT.jar
      Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
      MemorySize: 256
      Timeout: 60
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: rulesHeatQueueFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RulesAlertStateTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertsTopic.TopicName
        - SQSPollerPolicy:
            QueueName: !GetAtt RulesHeatQueue.QueueName
      Events:
        RulesHeatQueueTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt RulesHeatQueue.Arn
            BatchSize: 10
            Enabled: true

  # --- 4.3c Rules Engine Air Quality Service (Bulkhead Fault Isolation) ---
  RulesEngineAqFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'kestrel-rules-engine-aq-${Stage}'
      CodeUri: ../backend/services/rules-engine/target/rules-engine-0.0.1-SNAPSHOT.jar
      Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
      MemorySize: 256
      Timeout: 60
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: rulesAqQueueFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RulesAlertStateTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertsTopic.TopicName
        - SQSPollerPolicy:
            QueueName: !GetAtt RulesAqQueue.QueueName
      Events:
        RulesAqQueueTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt RulesAqQueue.Arn
            BatchSize: 10
            Enabled: true

  # --- 4.4 Alert Fanout Service ---
  AlertFanoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'kestrel-alert-fanout-${Stage}'
      CodeUri: ../backend/services/alert-fanout/target/alert-fanout-0.0.1-SNAPSHOT.jar
      Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
      MemorySize: 512
      Timeout: 90
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FanoutSubscriberReplicaTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FanoutDeliveryTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FanoutTgBucketTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt ReceiptsTopic.TopicName
        - SQSPollerPolicy:
            QueueName: !GetAtt FanoutAlertsQueue.QueueName
        - SQSPollerPolicy:
            QueueName: !GetAtt FanoutRegistryQueue.QueueName
        - SQSPollerPolicy:
            QueueName: !GetAtt DeliveryTelegramQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt DeliveryTelegramQueue.QueueName
        - SQSPollerPolicy:
            QueueName: !GetAtt DeliveryWebPushQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt DeliveryWebPushQueue.QueueName
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - '*'
      Events:
        AlertQueueTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt FanoutAlertsQueue.Arn
            BatchSize: 10
            Enabled: true
        RegistryQueueTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt FanoutRegistryQueue.Arn
            BatchSize: 10
            Enabled: true
        TelegramQueueTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt DeliveryTelegramQueue.Arn
            BatchSize: 10
            Enabled: true
        WebPushQueueTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt DeliveryWebPushQueue.Arn
            BatchSize: 10
            Enabled: true

  # --- 4.5 Report Intake Service ---
  ReportIntakeFunction:
