server:
  port: 8084

spring:
  application:
    name: alert-fanout

aws:
  region: ${AWS_REGION:${AWS_DEFAULT_REGION:ap-south-1}}
  dynamodb:
    endpoint: ${AWS_ENDPOINT_URL:${AWS_DYNAMODB_ENDPOINT:}}

kestrel:
  stage: ${STAGE:prod}
  persistence:
    type: ${KESTREL_PERSISTENCE:dynamodb}
  telegram:
    bot-token: "${TELEGRAM_BOT_TOKEN:}"
    chat-id: "${TELEGRAM_DEFAULT_CHAT_ID:}"
    api-url: "${TELEGRAM_API_URL:https://api.telegram.org}"
    rate-limit:
      target: 25
      ceiling: 30
