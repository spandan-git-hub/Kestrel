server:
  port: 8083

spring:
  application:
    name: rules-engine

aws:
  region: ${AWS_REGION:${AWS_DEFAULT_REGION:ap-south-1}}
  dynamodb:
    endpoint: ${AWS_ENDPOINT_URL:${AWS_DYNAMODB_ENDPOINT:}}

kestrel:
  stage: ${STAGE:prod}
  persistence:
    type: ${KESTREL_PERSISTENCE:dynamodb}
  events:
    fanout-url: http://localhost:8084/api/v1/fanout/events/alert
  flood-ingest:
    base-url: http://localhost:8082
