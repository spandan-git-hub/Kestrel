      Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
      MemorySize: 256
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReportsTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt SignalsTopic.TopicName
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - '*'

Outputs:
  StageOutput:
    Description: Deployed stage environment name
    Value: !Ref Stage

  SubscriberRegistryFunctionUrl:
    Description: CloudFront/Direct Function URL for Subscriber Registry Lambda
    Value: !GetAtt SubscriberRegistryFunctionUrl.FunctionUrl

  FloodIngestFunctionUrl:
    Description: Function URL for Flood Ingest Lambda
    Value: !GetAtt FloodIngestFunctionUrl.FunctionUrl

  HeatIngestFunctionUrl:
    Description: Function URL for Heat Ingest Lambda
    Value: !GetAtt HeatIngestFunctionUrl.FunctionUrl

  AqIngestFunctionUrl:
    Description: Function URL for Air Quality Ingest Lambda
    Value: !GetAtt AqIngestFunctionUrl.FunctionUrl

  AlertFanoutFunctionUrl:
    Description: Function URL for Alert Fanout Lambda
    Value: !GetAtt AlertFanoutFunctionUrl.FunctionUrl

  ReportIntakeFunctionUrl:
    Description: Function URL for Report Intake Lambda
    Value: !GetAtt ReportIntakeFunctionUrl.FunctionUrl

  RegistryTopicArn:
    Description: SNS Topic ARN for Registry Events
    Value: !Ref RegistryTopic
    Export:
      Name: !Sub '${AWS::StackName}-RegistryTopicArn'

  SignalsTopicArn:
    Description: SNS Topic ARN for Hydrological Signals
    Value: !Ref SignalsTopic
    Export:
      Name: !Sub '${AWS::StackName}-SignalsTopicArn'

  AlertsTopicArn:
    Description: SNS Topic ARN for Rules Engine Alert Events
    Value: !Ref AlertsTopic
    Export:
      Name: !Sub '${AWS::StackName}-AlertsTopicArn'

  ReceiptsTopicArn:
    Description: SNS Topic ARN for Fanout Delivery Receipts
    Value: !Ref ReceiptsTopic
    Export:
      Name: !Sub '${AWS::StackName}-ReceiptsTopicArn'

  RulesHeatQueueUrl:
    Description: SQS Queue URL for Rules Engine Heat Bulkhead Processing
    Value: !Ref RulesHeatQueue
    Export:
      Name: !Sub '${AWS::StackName}-RulesHeatQueueUrl'

  RulesAqQueueUrl:
    Description: SQS Queue URL for Rules Engine Air Quality Bulkhead Processing
    Value: !Ref RulesAqQueue
    Export:
      Name: !Sub '${AWS::StackName}-RulesAqQueueUrl'
