server:
  port: 8082

spring:
  application:
    name: flood-ingest
  datasource:
    url: jdbc:h2:mem:kestrel_flood_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

kestrel:
  open-meteo:
    base-url: https://flood-api.open-meteo.com/v1/flood
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
  events:
    rules-engine-url: http://localhost:8083/api/v1/rules/events/flood-signal
