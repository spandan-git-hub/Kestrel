server:
  port: 8081

spring:
  application:
    name: subscriber-registry

aws:
  region: ${AWS_REGION:${AWS_DEFAULT_REGION:ap-south-1}}
  dynamodb:
    endpoint: ${AWS_ENDPOINT_URL:${AWS_DYNAMODB_ENDPOINT:}}

kestrel:
  stage: ${STAGE:prod}
  persistence:
    type: ${KESTREL_PERSISTENCE:dynamodb}
  events:
    flood-ingest-url: http://localhost:8082/api/v1/flood/events/location-upserted
    rules-engine-url: http://localhost:8083/api/v1/rules/events/location-upserted
    fanout-url: http://localhost:8084/api/v1/fanout/events/location-upserted
    fanout-subscription-url: http://localhost:8084/api/v1/fanout/events/subscription-changed

management:
  endpoints:
    web:
      exposure:
        include: health,info
