server:
  port: 8082

spring:
  application:
    name: flood-ingest
  cloud:
    function:
      definition: dailyFloodIngest

aws:
  region: ${AWS_REGION:${AWS_DEFAULT_REGION:ap-south-1}}
  dynamodb:
    endpoint: ${AWS_ENDPOINT_URL:${AWS_DYNAMODB_ENDPOINT:}}

kestrel:
  stage: ${STAGE:prod}
  persistence:
    type: ${KESTREL_PERSISTENCE:dynamodb}
  open-meteo:
    base-url: https://flood-api.open-meteo.com/v1/flood
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
  events:
    rules-engine-url: http://localhost:8083/api/v1/rules/events/flood-signal
