server:
  port: 8083

spring:
  application:
    name: rules-engine
  datasource:
    url: jdbc:h2:mem:kestrel_rules_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

kestrel:
  events:
    fanout-url: http://localhost:8084/api/v1/fanout/events/alert
  flood-ingest:
    base-url: http://localhost:8082
