server:
  port: 8081

spring:
  application:
    name: subscriber-registry
  datasource:
    url: jdbc:h2:mem:kestrel_registry_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

kestrel:
  events:
    flood-ingest-url: http://localhost:8082/api/v1/flood/events/location-upserted
    rules-engine-url: http://localhost:8083/api/v1/rules/events/location-upserted
    fanout-url: http://localhost:8084/api/v1/fanout/events/location-upserted

management:
  endpoints:
    web:
      exposure:
        include: health,info
