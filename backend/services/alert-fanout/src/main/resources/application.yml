server:
  port: 8084

spring:
  application:
    name: alert-fanout
  datasource:
    url: jdbc:h2:mem:kestrel_fanout_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

kestrel:
  telegram:
    bot-token: ""
    chat-id: ""
